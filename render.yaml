databases:
  - name: timeclock-db
    plan: 0.1c-256mb
    databaseName: timeclock
    user: timeclock

services:
  - type: web
    name: timeclock-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: timeclock-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: ADMIN_API_KEY
        sync: false
